<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>야구왕</title>
    <!-- 홈 화면에 추가(PWA) — public/manifest.webmanifest, 서비스 워커는 public/sw.js(src/lib/pwa/install.ts가 등록) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1730" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="야구왕" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      첫 열기 스플래시(docs/effects-plan.md §2-1): 0.4초 안에 앱이 뜨면 보이지 않는다. 조명 4개가 차례로 서서히 켜진다
      (번쩍임 아님). #root 안에 있어서 앱이 그려지면 React가 통째로 바꾼다. 동작 줄이기면 조명은 처음부터 켜진 채.
    -->
    <style>
      .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;background:#0b1730;opacity:0;animation:splash-in .25s ease-out .4s forwards}
      .splash__lights{display:flex;gap:1.5rem}
      .splash__lights i{width:.9rem;height:.9rem;border-radius:50%;background:#fff;box-shadow:0 0 1.2rem .4rem rgba(219,232,255,.55);opacity:.12;animation:splash-light .5s ease-out forwards}
      .splash__lights i:nth-child(1){animation-delay:.5s}.splash__lights i:nth-child(2){animation-delay:.65s}.splash__lights i:nth-child(3){animation-delay:.8s}.splash__lights i:nth-child(4){animation-delay:.95s}
      .splash img{width:9rem;height:auto}
      @keyframes splash-in{to{opacity:1}}
      @keyframes splash-light{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){.splash__lights i{animation:none;opacity:1}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" aria-hidden="true">
        <div class="splash__lights"><i></i><i></i><i></i><i></i></div>
        <img src="/src/assets/brand/yaguking-emblem.webp" alt="" width="349" height="440" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

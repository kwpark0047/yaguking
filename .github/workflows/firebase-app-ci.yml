name: Firebase판 CI

# firebase-app/ 검사만 한다(배포하지 않는다). 배포는 firebase-deploy.yml — 꺼져 있다.
# 에뮬레이터만 쓰고 실제 Firebase 프로젝트에 닿지 않는다(demo-yaguking).
# 저장소의 기본 브랜치가 작업 브랜치(feat/p1-one-inning)라 그 브랜치에 올릴 때도 돈다(2026-11-01 — 그전에는 main에만 걸려 한 번도 안 돌았다).
# 손으로 다시 돌릴 때는 Actions › Firebase판 CI › Run workflow.
#
# Actions 사용량 줄이기(2026-11-18):
# - 문서(*.md·docs/)만 바꾸면 돌지 않는다
# - PR을 합친 뒤의 push("Merge #…"·"Merge pull request #…")에서는 PR에서 이미 통과한 에뮬레이터·E2E를 다시 돌리지 않는다(static만)
# - node_modules·Playwright 브라우저·Firebase 에뮬레이터 파일을 캐시해 설치 시간을 줄인다(키 = package-lock.json)
on:
  push:
    branches: [main, feat/p1-one-inning]
    paths:
      - 'firebase-app/**'
      - '!firebase-app/**/*.md'
      - '!firebase-app/docs/**'
      - '.github/workflows/firebase-app-ci.yml'
  pull_request:
    paths:
      - 'firebase-app/**'
      - '!firebase-app/**/*.md'
      - '!firebase-app/docs/**'
      - '.github/workflows/firebase-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-app-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: firebase-app

jobs:
  # 타입·단위·빌드 — Java 없이 돈다
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # node_modules 통째 캐시 — 잠금 파일이 같으면 npm ci를 건너뛴다
      - id: modules
        uses: actions/cache@v4
        with:
          path: firebase-app/node_modules
          key: fb-node-modules-${{ runner.os }}-node22-${{ hashFiles('firebase-app/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run admin:build
      # 글꼴 줄인 판이 화면 문구와 어긋나면 build가 새로 만든다 — 커밋에 빠졌는지 본다
      - run: git diff --exit-code -- src/assets/fonts

  # 보안 규칙·정리 작업 — Firestore 에뮬레이터(JDK 21)
  emulators:
    # PR을 합친 뒤의 push에서는 건너뛴다(PR에서 이미 통과)
    # 따옴표 필수 — YAML에서 따옴표 없는 ' #'는 주석으로 읽힌다
    if: "github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'Merge #') || startsWith(github.event.head_commit.message, 'Merge pull request #'))"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # node_modules 통째 캐시 — 잠금 파일이 같으면 npm ci를 건너뛴다
      - id: modules
        uses: actions/cache@v4
        with:
          path: firebase-app/node_modules
          key: fb-node-modules-${{ runner.os }}-node22-${{ hashFiles('firebase-app/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # Firebase 에뮬레이터(Firestore jar 등) 내려받기 캐시
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: fb-emulators-${{ runner.os }}-${{ hashFiles('firebase-app/package-lock.json') }}
      - run: npm run test:rules
      - run: npm run test:ops

  e2e:
    # 따옴표 필수 — YAML에서 따옴표 없는 ' #'는 주석으로 읽힌다
    if: "github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'Merge #') || startsWith(github.event.head_commit.message, 'Merge pull request #'))"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [static]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # node_modules 통째 캐시 — 잠금 파일이 같으면 npm ci를 건너뛴다
      - id: modules
        uses: actions/cache@v4
        with:
          path: firebase-app/node_modules
          key: fb-node-modules-${{ runner.os }}-node22-${{ hashFiles('firebase-app/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # Firebase 에뮬레이터(Firestore jar 등) 내려받기 캐시
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: fb-emulators-${{ runner.os }}-${{ hashFiles('firebase-app/package-lock.json') }}
      # Playwright 브라우저 캐시 — 맞으면 시스템 의존성만 설치
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: fb-playwright-${{ runner.os }}-${{ hashFiles('firebase-app/package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # github 보고: 실패한 테스트가 Actions 요약의 주석(annotation)으로 남는다
      - run: npx playwright test --reporter=github,list
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: firebase-app-playwright-report
          path: firebase-app/playwright-report/
          retention-days: 7

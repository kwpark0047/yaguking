name: Firebase판 CI

# firebase-app/ 검사만 한다(배포하지 않는다). 배포는 firebase-deploy.yml — 꺼져 있다.
# 에뮬레이터만 쓰고 실제 Firebase 프로젝트에 닿지 않는다(demo-yaguking).
# 저장소의 기본 브랜치가 작업 브랜치(feat/p1-one-inning)라 그 브랜치에 올릴 때도 돈다(2026-11-01 — 그전에는 main에만 걸려 한 번도 안 돌았다).
# 공개 저장소라 GitHub Actions 사용료가 없다. 손으로 다시 돌릴 때는 Actions › Firebase판 CI › Run workflow.
on:
  push:
    branches: [main, feat/p1-one-inning]
    paths: ['firebase-app/**', '.github/workflows/firebase-app-ci.yml']
  pull_request:
    paths: ['firebase-app/**', '.github/workflows/firebase-app-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-app-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: firebase-app

jobs:
  # 타입·단위·빌드 — Java 없이 돈다
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run admin:build
      # 글꼴 줄인 판이 화면 문구와 어긋나면 build가 새로 만든다 — 커밋에 빠졌는지 본다
      - run: git diff --exit-code -- src/assets/fonts

  # 보안 규칙·정리 작업 — Firestore 에뮬레이터(JDK 21)
  emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase-app/package-lock.json
      - run: npm ci
      - run: npm run test:rules
      - run: npm run test:ops

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [static]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # github 보고: 실패한 테스트가 Actions 요약의 주석(annotation)으로 남는다
      - run: npx playwright test --reporter=github,list
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: firebase-app-playwright-report
          path: firebase-app/playwright-report/
          retention-days: 7

name: CI

# 옛 Next.js판(저장소 맨 위 src·supabase·tests …) 검사. firebase-app/만 바꾼 PR·문서만 바꾼 PR에서는 돌지 않는다
# (Actions 사용량 줄이기, 2026-11-18). 손으로 돌릴 때는 Actions › CI › Run workflow.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'scripts/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'vitest.config.mts'
      - 'playwright.config.ts'
      - 'eslint.config.mjs'
      - 'postcss.config.mjs'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'scripts/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'vitest.config.mts'
      - 'playwright.config.ts'
      - 'eslint.config.mjs'
      - 'postcss.config.mjs'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 새로 올리면 앞의 실행을 멈춘다
concurrency:
  group: nextjs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DB 없이 돌아가는 검사. Docker가 필요 없다.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:sql
      - run: npm run test:unit -- --coverage
      - run: npm run build
      # 번들에 비밀값·정답 컬럼이 섞였는지 본다. 빌드 뒤에 실행해야 한다.
      - run: npm run security:check

  # 로컬 Supabase 스택이 필요한 검사 (마이그레이션 적용 + 통합 테스트).
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Supabase 로컬 스택 기동
        run: npx supabase start
      - name: 마이그레이션 + seed 적용
        run: npx supabase db reset --no-seed=false
      - name: DB advisors / lint
        run: npx supabase db lint
      - name: 통합 테스트
        # 계정 삭제 테스트는 Auth 관리 API 를 쓰므로 service_role 키가 필요하다.
        # 키가 없으면 해당 describe 만 건너뛰고 나머지는 그대로 돈다.
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export DATABASE_URL="$DB_URL"
          export GUEST_TOKEN_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")"
          npx vitest run tests/integration
      - name: 스택 종료
        if: always()
        run: npx supabase stop --no-backup

  e2e:
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# 운영 배포는 이 워크플로에 포함하지 않는다.
# 마이그레이션은 스테이징 적용·검증 후 수동 승인 게이트를 거쳐 운영에 올린다
# (09 문서 §9·§10).
